name: apamuy
services:
  postgres:
    image: postgres:16-alpine
    container_name: apamuy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apamuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apamuy}
      POSTGRES_DB: ${POSTGRES_DB:-apamuy}
    ports:
      # Solo desde esta máquina, no desde la red local.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apamuy -d apamuy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
