# Desarrollo local: Postgres 16 en el puerto 5433 (el 5432 suele estar ocupado
# por un Postgres instalado en la máquina). La API corre fuera de Docker con
# `npm run start:dev` desde backend/.
services:
  postgres:
    image: postgres:16-alpine
    container_name: chaski-postgres
    environment:
      POSTGRES_USER: chaski
      POSTGRES_PASSWORD: chaski
      POSTGRES_DB: chaski
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaski -d chaski"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
