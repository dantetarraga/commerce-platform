name: chaski
description: "Chaski — app de delivery (CUSTOMER)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  cached_network_image: ^4.0.0
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.7
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.1
  go_router: ^18.0.1
  intl: any  # la fija flutter_localizations
  json_annotation: ^4.12.0
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.9
  json_serializable: ^6.14.0
  very_good_analysis: ^10.1.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    - assets/icons/
  fonts:
    # Fuentes empaquetadas: la app no depende de la red para verse bien.
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf

