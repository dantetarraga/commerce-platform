name: chaski
description: 'Chaski — app de delivery (CUSTOMER).'
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  cached_network_image: ^4.0.0
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.7
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.1
  go_router: ^18.0.1
  intl: any
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.0
  rive: 0.14.11
  skeletonizer: ^3.0.0
  lottie: ^3.6.1
  flutter_animate: ^4.5.2
  toastification: ^3.2.0
  flutter_markdown_plus: ^1.0.12
  google_maps_flutter: ^2.18.2
  geolocator: ^14.0.1
  geocoding: ^5.0.0
  socket_io_client: ^3.1.6
dependency_overrides:
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.9
  json_serializable: ^6.14.0
  very_good_analysis: ^10.1.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/demo/
    - assets/animations/
    - assets/avatars/
    - assets/fixtures/
    - assets/icons/
    - assets/legal/
    - assets/sounds/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
