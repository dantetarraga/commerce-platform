# Arranque nativo: terracota con la "A" del logo, en el mismo tamaño y lugar
# que el primer cuadro de SplashPage. Regenerar: dart run flutter_native_splash:create --flavor customer
flutter_native_splash:
  color: "#B84A2B"
  image: assets/brand/splash_mark.png
  android_12:
    color: "#B84A2B"
    image: assets/brand/splash_mark_android12.png
  ios: false # iOS no tiene flavors: ver tool/brand/ios_splash.yaml
  web: false
  fullscreen: false
