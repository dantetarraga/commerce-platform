name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chaski
          POSTGRES_PASSWORD: chaski
          POSTGRES_DB: chaski_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chaski -d chaski_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://chaski:chaski@localhost:5432/chaski_test
      TEST_DATABASE_URL: postgresql://chaski:chaski@localhost:5432/chaski_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: Docker image
        run: docker build -t chaski-api .

  mobile:
    name: Mobile (analyze, test, APKs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Runtime Rive para las pruebas de Flutter
        run: dart run rive_native:setup --platform linux
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: APK del cliente
        run: flutter build apk --debug --flavor customer -t lib/main.dart
      - name: APK de Chaski Socios
        run: flutter build apk --debug --flavor partner -t lib/main_partner.dart
